# Refresh data snapshots and publish them to the `data` branch, then
# trigger a Pages deploy — but only when the data actually changed.
# Main stays clean: data commits never touch it.

name: Refresh data

on:
  workflow_dispatch:
  schedule:
    # Every 15 min during baseball hours: noon–1am ET, Mar–Oct
    - cron: '*/15 16-23,0-5 * 3-10 *'

concurrency:
  group: refresh-data
  # NEVER cancel a run in flight. Yahoo revokes the old refresh token the instant
  # it issues a new one, so a run killed between rotating and persisting leaves
  # the stored secret permanently dead — there is no way to recover it without a
  # manual browser re-auth. Queueing is the safe failure mode; the pipelines are
  # incremental and idempotent, so a late run simply catches up.
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/checkout@v4

      # Start from the previous snapshot so pipelines update incrementally,
      # and keep a copy for change detection.
      - name: Restore data branch
        run: |
          if git fetch origin data 2>/dev/null; then
            git worktree add /tmp/data-branch origin/data
            rsync -a /tmp/data-branch/ data/ --exclude .git
            git worktree remove /tmp/data-branch
            cp -R data /tmp/prev-data
          else
            echo "No data branch yet — starting fresh"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Yahoo access tokens live an hour, but this workflow runs every 15 minutes.
      # Without a persisted cache every run starts tokenless and is FORCED to
      # refresh from the stored refresh token — rotating it ~96x/day, and every
      # rotation is a chance to break the chain. Carrying the cache across runs
      # drops that to roughly once an hour. Cache misses are safe: auth.ts falls
      # back to the YAHOO_REFRESH_TOKEN secret.
      - name: Restore Yahoo token cache
        uses: actions/cache/restore@v4
        with:
          path: token-cache.json
          key: yahoo-token-${{ github.run_id }}
          restore-keys: yahoo-token-

      - name: Mask restored token material
        if: hashFiles('token-cache.json') != ''
        run: |
          node -e "
            const c = require('./token-cache.json');
            console.log('::add-mask::' + c.accessToken);
            console.log('::add-mask::' + c.refreshToken);
          "

      - name: Ensure a valid Yahoo access token
        id: token
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
        run: |
          npm run token ensure
          node -e "
            const c = require('./token-cache.json');
            console.log('::add-mask::' + c.accessToken);
            console.log('::add-mask::' + c.refreshToken);
          "

      - name: Fetch data
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
        run: |
          npm run fetch:settings -- --current
          npm run fetch:live
          npm run fetch:players
          npm run fetch:mlb
          npm run fetch:news

      # The token is persisted AFTER the pipelines, never before. client.ts
      # refreshes on a 401 and getAccessToken() refreshes on expiry, so the
      # fetch step above can rotate the token on its own — and that replacement
      # lives nowhere but token-cache.json. Persisting on the way in would save
      # the token we already replaced and drop the live one with the runner,
      # which is the exact failure this whole workflow exists to avoid.
      # `always()`: a failed or cancelled fetch can still have rotated.
      - name: Re-check the refresh token after fetching
        id: token_final
        if: always()
        env:
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
        run: |
          npm run token check
          if [ -f token-cache.json ]; then
            node -e "
              const c = require('./token-cache.json');
              console.log('::add-mask::' + c.accessToken);
              console.log('::add-mask::' + c.refreshToken);
            "
          fi

      # Only runs when the refresh token actually changed. When it does, this is
      # MANDATORY, not best-effort: Yahoo already killed the previous token, so
      # if the replacement doesn't land the next run dies with invalid_grant and
      # data silently freezes. Fail loudly here, on the run that caused it.
      - name: Store rotated refresh token
        if: always() && steps.token_final.outputs.needs_store == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::GH_PAT is not set, so the rotated Yahoo refresh token cannot be saved. The old token was just invalidated, so the next run will fail with invalid_grant. Add a fine-grained PAT (this repo only, Secrets: read/write) as the GH_PAT secret — see AUTH.md."
            exit 1
          fi
          if [ ! -f token-cache.json ]; then
            echo "::error::token-cache.json is missing after a successful refresh — nothing to persist."
            exit 1
          fi
          node -e "process.stdout.write(require('./token-cache.json').refreshToken)" \
            | gh secret set YAHOO_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY"
          echo "Persisted the rotated refresh token to YAHOO_REFRESH_TOKEN."

      # Save even when an earlier step failed: the cache holds the only live copy
      # of a token we may have just rotated, so dropping it would force a manual
      # re-auth. `always()` here is deliberate.
      - name: Save Yahoo token cache
        if: always() && hashFiles('token-cache.json') != ''
        uses: actions/cache/save@v4
        with:
          path: token-cache.json
          key: yahoo-token-${{ github.run_id }}

      - name: Publish data branch (if changed)
        id: publish
        run: |
          # manifest.json only carries the freshness timestamp — ignore it
          # when deciding whether anything real changed.
          if [ -d /tmp/prev-data ] && diff -rq --exclude=manifest.json /tmp/prev-data data >/dev/null 2>&1; then
            echo "No data changes — skipping publish and deploy"
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cd data
          git init -b data
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Data snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" data
          echo "published=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: refresh
    if: needs.refresh.outputs.published == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
