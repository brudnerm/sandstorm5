# Refresh data snapshots and publish them to the `data` branch, then
# trigger a Pages deploy — but only when the data actually changed.
# Main stays clean: data commits never touch it.

name: Refresh data

on:
  workflow_dispatch:
  schedule:
    # Every 15 min during baseball hours: noon–1am ET, Mar–Oct
    - cron: '*/15 16-23,0-5 * 3-10 *'

concurrency:
  group: refresh-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/checkout@v4

      # Start from the previous snapshot so pipelines update incrementally,
      # and keep a copy for change detection.
      - name: Restore data branch
        run: |
          if git fetch origin data 2>/dev/null; then
            git worktree add /tmp/data-branch origin/data
            rsync -a /tmp/data-branch/ data/ --exclude .git
            git worktree remove /tmp/data-branch
            cp -R data /tmp/prev-data
          else
            echo "No data branch yet — starting fresh"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Refresh Yahoo token
        id: token
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
        run: |
          npm run token refresh
          node -e "
            const c = require('./token-cache.json');
            console.log('::add-mask::' + c.accessToken);
            console.log('::add-mask::' + c.refreshToken);
          "

      # Yahoo rotates the refresh token on every use and invalidates the
      # previous one, so the step above already consumed the stored token.
      # Persisting the rotated replacement is MANDATORY, not best-effort:
      # if it doesn't land, the next run dies with invalid_grant and data
      # silently freezes. Fail loudly here instead so the break is visible
      # immediately, on the run that caused it.
      - name: Store rotated refresh token
        if: steps.token.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::GH_PAT is not set, so the rotated Yahoo refresh token cannot be saved. The old token was just invalidated, so the next run will fail with invalid_grant. Add a fine-grained PAT (this repo only, Secrets: read/write) as the GH_PAT secret — see AUTH.md."
            exit 1
          fi
          if [ ! -f token-cache.json ]; then
            echo "::error::token-cache.json is missing after a successful refresh — nothing to persist."
            exit 1
          fi
          node -e "process.stdout.write(require('./token-cache.json').refreshToken)" \
            | gh secret set YAHOO_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY"
          echo "Persisted the rotated refresh token to YAHOO_REFRESH_TOKEN."

      - name: Fetch data
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
        run: |
          npm run fetch:settings -- --current
          npm run fetch:live
          npm run fetch:players
          npm run fetch:mlb
          npm run fetch:news

      - name: Publish data branch (if changed)
        id: publish
        run: |
          # manifest.json only carries the freshness timestamp — ignore it
          # when deciding whether anything real changed.
          if [ -d /tmp/prev-data ] && diff -rq --exclude=manifest.json /tmp/prev-data data >/dev/null 2>&1; then
            echo "No data changes — skipping publish and deploy"
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cd data
          git init -b data
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Data snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" data
          echo "published=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: refresh
    if: needs.refresh.outputs.published == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
